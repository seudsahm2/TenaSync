<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TenaSync Stealth Portal — Secure Somatic Handoff</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .stealth-portal {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 100px);
      text-align: center;
      padding: 24px;
    }
    
    .scanner-outer {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2px dashed rgba(99, 102, 241, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
      animation: rotate-dashed 12s linear infinite;
    }
    
    .scanner-inner {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, rgba(99, 102, 241, 0) 70%);
      border: 2px solid var(--color-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse-glow 2s infinite ease-in-out;
    }
    
    .scanner-icon {
      font-size: 36px;
      animation: float-icon 3s infinite ease-in-out;
    }
    
    .scanner-line {
      position: absolute;
      left: 10px;
      right: 10px;
      height: 2px;
      background: linear-gradient(90deg, rgba(99,102,241,0) 0%, rgba(99,102,241,1) 50%, rgba(99,102,241,0) 100%);
      box-shadow: 0 0 10px var(--color-accent);
      animation: scan-vertical 2s infinite ease-in-out;
    }

    @keyframes rotate-dashed {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); }
      50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(99, 102, 241, 0.5); }
    }
    @keyframes float-icon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes scan-vertical {
      0%, 100% { top: 10px; opacity: 0; }
      5% { opacity: 1; }
      95% { opacity: 1; }
      50% { top: 130px; }
    }
    
    .status-text {
      font-size: 14px;
      color: var(--color-text-secondary);
      margin-top: 10px;
      font-family: 'Inter', sans-serif;
    }
    
    .loading-bar {
      width: 180px;
      height: 4px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      margin-top: 16px;
      overflow: hidden;
    }
    
    .loading-fill {
      height: 100%;
      background: var(--color-accent);
      width: 0%;
      border-radius: 2px;
      animation: fill-progress 3s forwards ease-out;
    }
    
    @keyframes fill-progress {
      to { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="stealth-portal">
      <div class="scanner-outer">
        <div class="scanner-line"></div>
        <div class="scanner-inner">
          <div class="scanner-icon">🔬</div>
        </div>
      </div>
      
      <h2 style="font-size: 20px; margin-bottom: 8px;">TenaSync Stealth Link</h2>
      <p style="font-size: 13px; color: var(--color-text-secondary); max-width: 280px; line-height: 1.5;">
        Establishing cryptographically secure session tunnel. Intercepted somatic indicators verified.
      </p>
      
      <div class="status-text" id="status-display">Initializing scan sequence...</div>
      
      <div class="loading-bar">
        <div class="loading-fill"></div>
      </div>
    </div>
  </div>

  <script>
    // Extract query parameters
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('user_id') || '0';
    const mode = params.get('mode') || 'stealth';
    
    const statusDisplay = document.getElementById('status-display');
    const stages = [
      { time: 600, text: "Decrypting handoff tokens..." },
      { time: 1300, text: "Verifying somatic posture indicators..." },
      { time: 2100, text: "Mapping cervical-lumbar strain models..." },
      { time: 2700, text: "Redirecting to private workspace..." }
    ];
    
    stages.forEach(stage => {
      setTimeout(() => {
        statusDisplay.textContent = stage.text;
      }, stage.time);
    });
    
    // Redirect to main workspace
    setTimeout(() => {
      window.location.href = `index.html?user_id=${userId}&mode=${mode}&autostart=spine`;
    }, 3000);
  </script>
</body>
</html>
