<div class="specialized-module">
  <h2>Maternal Recovery Tracker</h2>
  <div id="maternal-log-form">
    <h3>Log Status</h3>
    <form id="logMaternalForm">
      <label>Postpartum Week:</label>
      <input type="number" id="postpartumWeek" min="1" required />
      
      <label>Pain Level (1-10):</label>
      <input type="number" id="maternalPainLevel" min="1" max="10" required />
      
      <label>Mood:</label>
      <input type="text" id="mood" />
      
      <button type="submit">Log Status</button>
    </form>
  </div>
  <div id="maternal-history">
    <h3>Recovery History</h3>
    <ul id="maternalHistoryList"></ul>
  </div>
</div>
