<div class="specialized-module">
  <h2>Spine Health Dashboard</h2>
  <div id="spine-assessment-form">
    <h3>Log Assessment</h3>
    <form id="logSpineForm">
      <label>Pain Level (1-10):</label>
      <input type="number" id="painLevel" min="1" max="10" required />
      
      <label>Hours Seated Today:</label>
      <input type="number" id="hoursSeated" min="0" required />
      
      <label>Notes:</label>
      <input type="text" id="notes" />
      
      <button type="submit">Log Assessment</button>
    </form>
  </div>
  <div id="spine-history">
    <h3>Assessment History</h3>
    <ul id="spineHistoryList"></ul>
  </div>
</div>
